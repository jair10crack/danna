services:
  - type: web
    name: danna-demo
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn danna.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
